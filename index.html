<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS — Lucid Flowchart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f4f6f9;
    background-image:
      linear-gradient(rgba(200,210,230,0.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,210,230,0.22) 1px, transparent 1px);
    background-size: 24px 24px;
    padding: 40px 24px 80px;
    color: #333;
  }
  h1 { text-align: center; font-size: 30px; color: #2c3e50; margin-bottom: 6px; }
  .page-sub { text-align: center; font-size: 14px; color: #95a5a6; margin-bottom: 48px; }

  .chart-section {
    max-width: 1300px;
    margin: 0 auto 50px;
  }
  .chart-section h2 {
    font-size: 19px;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 14px;
    padding-left: 4px;
  }
  .svg-wrap {
    background: #fff;
    border: 1px solid #dce1e8;
    border-radius: 10px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    overflow-x: auto;
    padding: 10px;
  }
  svg { display: block; margin: 0 auto; }
  svg text { font-family: 'Segoe UI', system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>

<h1>Employee Management System</h1>
<p class="page-sub">System Flowchart &mdash; Lucidchart Style</p>


<!-- 1. EMPLOYEE LIFECYCLE -->
<div class="chart-section">
  <h2>1. Employee Lifecycle</h2>

      <text x="90" y="87" font-size="14" fill="#880E4F" text-anchor="middle" font-weight="600">Job Post</text>

      <line x1="160" y1="82" x2="198" y2="82" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

      <rect x="200" y="55" width="140" height="55" rx="8" fill="#B3E5FC" stroke="#0288D1" stroke-width="1.5"/>
      <text x="270" y="87" font-size="14" fill="#01579B" text-anchor="middle" font-weight="600">Screening</text>

      <line x1="340" y1="82" x2="378" y2="82" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

      <rect x="380" y="55" width="140" height="55" rx="8" fill="#B3E5FC" stroke="#0288D1" stroke-width="1.5"/>
      <text x="450" y="87" font-size="14" fill="#01579B" text-anchor="middle" font-weight="600">Interview</text>

      <line x1="520" y1="82" x2="553" y2="82" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

      <polygon points="600,45 645,82 600,119 555,82" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
      <text x="600" y="86" font-size="13" fill="#E65100" text-anchor="middle" font-weight="700">Hire?</text>

      <line x1="645" y1="82" x2="683" y2="82" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
      <text x="658" y="74" font-size="11" fill="#388E3C" font-weight="600">Yes</text>

      <rect x="685" y="55" width="150" height="55" rx="8" fill="#C8E6C9" stroke="#388E3C" stroke-width="1.5"/>
      <text x="760" y="78" font-size="13" fill="#1B5E20" text-anchor="middle" font-weight="600">Onboarding</text>
      <text x="760" y="94" font-size="11" fill="#2E7D32" text-anchor="middle">4-Step Form</text>

      <line x1="835" y1="82" x2="873" y2="82" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

      <rect x="875" y="55" width="160" height="55" rx="8" fill="#C8E6C9" stroke="#388E3C" stroke-width="1.5"/>
      <text x="955" y="78" font-size="13" fill="#1B5E20" text-anchor="middle" font-weight="600">Active Employee</text>
      <text x="955" y="94" font-size="11" fill="#2E7D32" text-anchor="middle">Work &middot; Train &middot; Grow</text>

      <!-- No branch -->
      <line x1="600" y1="119" x2="600" y2="158" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
      <text x="614" y="142" font-size="11" fill="#D32F2F" font-weight="600">No</text>
      <rect x="530" y="160" width="140" height="36" rx="8" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1.3"/>
      <text x="600" y="183" font-size="12" fill="#4A148C" text-anchor="middle" font-weight="600">Talent Pool</text>
    </svg>
  </div>
</div>


<!-- 2. DASHBOARD -->

  <h2>2. Dashboard</h2>

      <rect x="0" y="155" width="1100" height="155" fill="#E8F5E9"/>

      <line x1="110" y1="0" x2="110" y2="310" stroke="#ccc" stroke-width="1"/>

      <!-- Login -->
      <rect x="135" y="110" width="110" height="50" rx="25" fill="#CE93D8" stroke="#8E24AA" stroke-width="1.8"/>
      <text x="190" y="140" font-size="13" fill="#4A148C" text-anchor="middle" font-weight="600">Login</text>

      <!-- Diamond -->
      <polygon points="330,105 375,135 330,165 285,135" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.8"/>
      <text x="330" y="138" font-size="11" fill="#E65100" text-anchor="middle" font-weight="700">Role?</text>
      <line x1="245" y1="135" x2="284" y2="135" stroke="#666" stroke-width="1.8" marker-end="url(#b)"/>

      <!-- Admin branch up -->
      <line x1="330" y1="105" x2="330" y2="65" stroke="#666" stroke-width="1.8"/>
      <line x1="330" y1="65" x2="438" y2="65" stroke="#666" stroke-width="1.8" marker-end="url(#b)"/>
      <text x="375" y="58" font-size="11" fill="#1565C0" font-weight="600">Admin / HR</text>

      <rect x="440" y="38" width="170" height="54" rx="8" fill="#B3E5FC" stroke="#0288D1" stroke-width="1.5"/>
      <text x="525" y="60" font-size="13" fill="#01579B" text-anchor="middle" font-weight="600">Admin Dashboard</text>
      <text x="525" y="78" font-size="11" fill="#0277BD" text-anchor="middle">KPIs &middot; Approvals &middot; Charts</text>

      <!-- Admin sub-nodes -->
      <rect x="650" y="20" width="145" height="38" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
      <text x="722" y="44" font-size="11" fill="#1565C0" text-anchor="middle">Pending Actions</text>
      <line x1="610" y1="55" x2="648" y2="42" stroke="#666" stroke-width="1.2" marker-end="url(#b)"/>

      <rect x="650" y="66" width="145" height="38" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>

      <rect x="835" y="20" width="155" height="38" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
      <text x="912" y="44" font-size="11" fill="#1565C0" text-anchor="middle">Attendance &middot; Dept</text>
      <line x1="795" y1="39" x2="833" y2="39" stroke="#666" stroke-width="1.2" marker-end="url(#b)"/>

      <rect x="835" y="66" width="155" height="38" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
      <text x="912" y="90" font-size="11" fill="#1565C0" text-anchor="middle">News &middot; Birthdays</text>
      <line x1="795" y1="85" x2="833" y2="85" stroke="#666" stroke-width="1.2" marker-end="url(#b)"/>

      <!-- Employee branch down -->
      <line x1="330" y1="165" x2="330" y2="225" stroke="#666" stroke-width="1.8"/>
      <line x1="330" y1="225" x2="438" y2="225" stroke="#666" stroke-width="1.8" marker-end="url(#b)"/>
      <text x="370" y="218" font-size="11" fill="#2E7D32" font-weight="600">Employee</text>

      <rect x="440" y="198" width="170" height="54" rx="8" fill="#C8E6C9" stroke="#388E3C" stroke-width="1.5"/>
      <text x="525" y="220" font-size="13" fill="#1B5E20" text-anchor="middle" font-weight="600">My Dashboard</text>
      <text x="525" y="238" font-size="11" fill="#2E7D32" text-anchor="middle">Clock In &middot; Stats &middot; Leave</text>

      <!-- Employee sub-nodes -->
      <rect x="650" y="180" width="145" height="38" rx="6" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.2"/>
      <text x="722" y="204" font-size="11" fill="#1B5E20" text-anchor="middle">Clock In/Out Timer</text>
      <line x1="610" y1="215" x2="648" y2="202" stroke="#666" stroke-width="1.2" marker-end="url(#b)"/>

      <rect x="650" y="226" width="145" height="38" rx="6" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.2"/>
      <text x="722" y="250" font-size="11" fill="#1B5E20" text-anchor="middle">Training &middot; Holidays</text>
      <line x1="610" y1="232" x2="648" y2="242" stroke="#666" stroke-width="1.2" marker-end="url(#b)"/>
    </svg>
  </div>
</div>


<!-- 3. WORKFORCE -->
<div class="chart-section">
  <h2>3. Workforce — Employees &amp; Departments</h2>
  <div class="svg-wrap">
    <svg viewBox="0 0 1200 300" width="1260" height="315">
      <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#666"/></marker></defs>

      <rect x="0" y="0" width="1200" height="148" fill="#F3E5F5"/>
      <rect x="0" y="148" width="1200" height="152" fill="#E8F5E9"/>
      <text x="14" y="78" font-size="14" font-weight="700" fill="#6A1B9A">HR / Admin</text>
      <text x="14" y="228" font-size="14" font-weight="700" fill="#2E7D32">Employee</text>
      <line x1="0" y1="148" x2="1200" y2="148" stroke="#ccc"/>

      <text x="200" y="62" font-size="11" fill="#6A1B9A" text-anchor="middle">Search &middot; Filter</text>

      <!-- Add Employee -->
      <rect x="315" y="22" width="150" height="52" rx="8" fill="#CE93D8" stroke="#8E24AA" stroke-width="1.5"/>
      <text x="390" y="44" font-size="13" fill="#4A148C" text-anchor="middle" font-weight="600">Add Employee</text>
      <text x="390" y="62" font-size="11" fill="#6A1B9A" text-anchor="middle">4-Step Form</text>
      <line x1="275" y1="48" x2="313" y2="48" stroke="#666" stroke-width="1.5" marker-end="url(#c)"/>

      <!-- 4 steps -->
      <rect x="125" y="88" width="85" height="34" rx="5" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1"/>
      <text x="167" y="110" font-size="10" fill="#6A1B9A" text-anchor="middle">Personal</text>
      <line x1="210" y1="105" x2="222" y2="105" stroke="#999" stroke-width="1" marker-end="url(#c)"/>
      <rect x="224" y="88" width="70" height="34" rx="5" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1"/>
      <text x="259" y="110" font-size="10" fill="#6A1B9A" text-anchor="middle">Job</text>
      <line x1="294" y1="105" x2="306" y2="105" stroke="#999" stroke-width="1" marker-end="url(#c)"/>
      <rect x="308" y="88" width="70" height="34" rx="5" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1"/>
      <text x="343" y="110" font-size="10" fill="#6A1B9A" text-anchor="middle">Bank</text>
      <line x1="378" y1="105" x2="390" y2="105" stroke="#999" stroke-width="1" marker-end="url(#c)"/>
      <rect x="392" y="88" width="70" height="34" rx="5" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1"/>
      <text x="427" y="110" font-size="10" fill="#6A1B9A" text-anchor="middle">Docs</text>

      <!-- Departments -->
      <rect x="530" y="22" width="155" height="52" rx="8" fill="#CE93D8" stroke="#8E24AA" stroke-width="1.5"/>
      <text x="607" y="44" font-size="13" fill="#4A148C" text-anchor="middle" font-weight="600">Departments</text>
      <text x="607" y="62" font-size="11" fill="#6A1B9A" text-anchor="middle">Org Chart &middot; Budget</text>

      <!-- Assign / Transfer -->
      <rect x="725" y="22" width="155" height="52" rx="8" fill="#CE93D8" stroke="#8E24AA" stroke-width="1.5"/>
      <text x="802" y="44" font-size="13" fill="#4A148C" text-anchor="middle" font-weight="600">Assign / Transfer</text>
      <text x="802" y="62" font-size="11" fill="#6A1B9A" text-anchor="middle">Bulk &middot; Log</text>
      <line x1="685" y1="48" x2="723" y2="48" stroke="#666" stroke-width="1.5" marker-end="url(#c)"/>

      <!-- Employee Profile -->
      <rect x="125" y="170" width="160" height="52" rx="8" fill="#C8E6C9" stroke="#388E3C" stroke-width="1.5"/>

      <line x1="200" y1="74" x2="200" y2="168" stroke="#666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#c)"/>

      <!-- Profile tabs row 1 -->
      <rect x="330" y="165" width="95" height="32" rx="5" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
      <text x="377" y="186" font-size="11" fill="#2E7D32" text-anchor="middle">Overview</text>
      <line x1="285" y1="190" x2="328" y2="182" stroke="#666" stroke-width="1" marker-end="url(#c)"/>

      <rect x="435" y="165" width="100" height="32" rx="5" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
      <text x="485" y="186" font-size="11" fill="#2E7D32" text-anchor="middle">Attendance</text>

      <text x="675" y="186" font-size="11" fill="#2E7D32" text-anchor="middle">Payroll</text>
      <line x1="625" y1="181" x2="633" y2="181" stroke="#666" stroke-width="1" marker-end="url(#c)"/>

      <!-- Profile tabs row 2 -->

    </svg>
  </div>
</div>


<!-- 4. RECRUITMENT -->
<div class="chart-section">
  <h2>4. Recruitment — Hiring Pipeline</h2>
  <div class="svg-wrap">
    <svg viewBox="0 0 1200 320" width="1260" height="336">
      <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#666"/></marker></defs>

      <rect x="0" y="0" width="1200" height="107" fill="#FFF8E1"/>
      <rect x="0" y="107" width="1200" height="107" fill="#E3F2FD"/>
      <rect x="0" y="214" width="1200" height="106" fill="#E8F5E9"/>
      <text x="14" y="58" font-size="14" font-weight="700" fill="#E65100">HR</text>
      <text x="14" y="165" font-size="14" font-weight="700" fill="#1565C0">Panel</text>
      <text x="14" y="272" font-size="14" font-weight="700" fill="#2E7D32">System</text>
      <line x1="0" y1="107" x2="1200" y2="107" stroke="#ccc"/>
      <line x1="0" y1="214" x2="1200" y2="214" stroke="#ccc"/>
      <line x1="55" y1="0" x2="55" y2="320" stroke="#ccc"/>

      <!-- Create Job -->
      <rect x="80" y="25" width="150" height="50" rx="8" fill="#FFE082" stroke="#F9A825" stroke-width="1.5"/>
      <text x="155" y="55" font-size="13" fill="#E65100" text-anchor="middle" font-weight="600">Create Job Post</text>

      <!-- Candidates -->
      <rect x="275" y="25" width="150" height="50" rx="8" fill="#FFE082" stroke="#F9A825" stroke-width="1.5"/>
      <text x="350" y="55" font-size="13" fill="#E65100" text-anchor="middle" font-weight="600">Candidates Apply</text>
      <line x1="230" y1="50" x2="273" y2="50" stroke="#666" stroke-width="1.8" marker-end="url(#d)"/>

      <!-- Screen -->
      <rect x="470" y="25" width="140" height="50" rx="8" fill="#FFE082" stroke="#F9A825" stroke-width="1.5"/>
      <text x="540" y="55" font-size="13" fill="#E65100" text-anchor="middle" font-weight="600">Screening</text>
      <line x1="425" y1="50" x2="468" y2="50" stroke="#666" stroke-width="1.8" marker-end="url(#d)"/>

      <!-- Schedule -->
      <rect x="655" y="25" width="155" height="50" rx="8" fill="#FFE082" stroke="#F9A825" stroke-width="1.5"/>
      <text x="732" y="55" font-size="13" fill="#E65100" text-anchor="middle" font-weight="600">Schedule Interview</text>
      <line x1="610" y1="50" x2="653" y2="50" stroke="#666" stroke-width="1.8" marker-end="url(#d)"/>

      <!-- Interview (Panel) -->

      <text x="925" y="158" font-size="13" fill="#01579B" text-anchor="middle" font-weight="600">Feedback</text>
      <line x1="810" y1="154" x2="853" y2="154" stroke="#666" stroke-width="1.8" marker-end="url(#d)"/>

      <!-- Decision -->

      <text x="1060" y="158" font-size="13" fill="#E65100" text-anchor="middle" font-weight="700">Hire?</text>
      <line x1="995" y1="154" x2="1019" y2="154" stroke="#666" stroke-width="1.8" marker-end="url(#d)"/>
